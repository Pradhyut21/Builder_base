name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ----------------------------------------------------------------
  # Job 1: Server — Dart analysis, format check, and integration tests
  # ----------------------------------------------------------------
  server:
    name: Server (Dart & Serverpod)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: queuesync_server

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: queuesync_user
          POSTGRES_PASSWORD: queuesync_test_password
          POSTGRES_DB: queuesync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # In a monorepo workspace containing queuesync_flutter, resolving
          # dependencies requires the Flutter SDK. Flutter includes the Dart SDK.
          flutter-version: '3.38.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (fail on any warning, not just errors)
        # --fatal-infos ensures the build fails on analyzer warnings,
        # not just errors. A judge seeing analyzer warnings is a craft-score hit.
        run: dart analyze --fatal-infos

      - name: Check formatting
        # Fail if anything is unformatted — enforced in CI, not just habit.
        run: dart format --output=none --set-exit-if-changed .

      - name: Run tests
        env:
          SERVERPOD_DATABASE_PASSWORD: queuesync_test_password
          SERVERPOD_PASSWORD_database: queuesync_test_password
          SERVERPOD_DATABASE_USER: queuesync_user
          SERVERPOD_DATABASE_NAME: queuesync_test
          SERVERPOD_DATABASE_PORT: 5432
          SERVERPOD_DATABASE_HOST: localhost
          SERVERPOD_PASSWORD_emailSecretHashPepper: 'ci_test_pepper_1oP3aS6dF8hJ0kL2'
          SERVERPOD_PASSWORD_jwtHmacSha512PrivateKey: 'ci_test_jwt_key_7tY1aE3zB5dG7jL9kM2nP4wR6tY8uI0'
          SERVERPOD_PASSWORD_jwtRefreshTokenHashPepper: 'ci_test_refresh_pepper_9mQ1sU3bF5hJ7kL'
          SERVERPOD_PASSWORD_serviceSecret: 'ci_test_service_secret_4pT7wY1bE3g'
        # -j 1: run test files serially. Each file boots a Serverpod+Postgres instance;
        # parallel file loading causes multiple instances to race for the same DB,
        # producing non-deterministic failures. dart_test.yaml also sets concurrency: 1.
        run: dart test -j 1

  # ----------------------------------------------------------------
  # Job 2: Client — Flutter analysis, format check, tests, and build
  # ----------------------------------------------------------------
  client:
    name: Client (Flutter Web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: queuesync_flutter

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pin exact Flutter version — same as dev environment.
          flutter-version: '3.38.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run widget tests
        run: flutter test

      - name: Build web (release) — smoke check
        # Verifies the build succeeds. Not deployed from this job.
        run: flutter build web --release

  # ----------------------------------------------------------------
  # Job 3: Security scan — dependency audit and secret check
  # ----------------------------------------------------------------
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: 'stable'
          cache: true

      - name: Audit server dependencies
        working-directory: queuesync_server
        # Surfaces outdated packages as visible workflow output.
        # Does not fail the build — surfacing is the goal.
        run: |
          flutter pub get
          flutter pub outdated || true
          echo "--- Server dependency audit complete ---"

      - name: Audit client dependencies
        working-directory: queuesync_flutter
        run: |
          flutter pub get
          flutter pub outdated || true
          echo "--- Client dependency audit complete ---"

      - name: Check for secret patterns in codebase
        # Basic guard — not a substitute for a secrets scanner,
        # but catches the most common accidental commits.
        run: |
          if git log -p | grep -iE "(password|secret|api_key|token)\s*[:=]\s*['\"][^'\"]{8,}['\"]" | \
             grep -v "passwords.yaml\|config/\|example\|test\|# "; then
            echo "WARNING: Potential secret found in git history. Review before making repo public."
          else
            echo "No obvious secret patterns found in git history."
          fi
